# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The game state lives in server memory, so this must stay a single instance (no scaling).
services:
  - type: web
    name: night-shift
    runtime: node
    # free: sleeps after 15 min without traffic (about 1 min to wake) and loses state on restart.
    # Switch to "starter" for the demo day so the wall never cold-starts.
    plan: free
    region: frankfurt
    # Vite, Tailwind and TypeScript are devDependencies; --include=dev keeps them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render generates a long random key. Copy it from the Environment tab and open
      # https://<your-app>.onrender.com/wall?presenter=<key>
      - key: PRESENTER_KEY
        generateValue: true
      # Screens in the room, left to right (see DEPLOY.md). Change it here or in the Environment tab.
      - key: ROOM_ORDER
        value: "2,1,3,4,5"
      # Morning report by Claude (claude-haiku-5-5). Optional: without it, or if the API fails or takes
      # over 8 s, the template report is used. Set it in the Environment tab; it never reaches the browser.
      - key: ANTHROPIC_API_KEY
        sync: false
